# ============================================================================
# emoking —— DSH bundle patch
# ============================================================================
# 这是插件的「挂载声明」。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件把「模拟抽烟」挂件插入当前 profile 的配置树。
#
# 安装（本地开发目录）：
#   在 profile 的 package.json 中把本插件目录作为 link: 依赖安装，
#   并把 emoking 加入 dsh.profile.bundles，然后重启 DSH。
#   本仓库根目录的 安装到DSH.cmd / install.ps1 会自动完成这些步骤（带备份）。
# ============================================================================

- insert:
    - id: emoking
      name: emoking
