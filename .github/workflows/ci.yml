name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check (plugin host & frontend)
        run: |
          node --check lib/index.js
          for f in assets/*.js; do node --check "$f"; done

      - name: Release checks
        run: node scripts/release-check.mjs

      - name: npm pack (dry run)
        run: npm pack --dry-run
